name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Install dependencies
        run: npm ci

      - name: Generate production env file
        shell: bash
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          PROOFS_BUCKET_NAME: ${{ secrets.PROOFS_BUCKET_NAME }}
          TF_VAR_amplify_repository_url: ${{ secrets.TF_VAR_amplify_repository_url }}
          TF_VAR_amplify_access_token: ${{ secrets.TF_VAR_amplify_access_token }}
          TF_VAR_amplify_branch_name: ${{ secrets.TF_VAR_amplify_branch_name }}
        run: |
          {
            printf 'AWS_REGION=%s\n' "$AWS_REGION"
            printf 'AWS_ACCESS_KEY_ID=%s\n' "$AWS_ACCESS_KEY_ID"
            printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$AWS_SECRET_ACCESS_KEY"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'DIRECT_DATABASE_URL=%s\n' "$DIRECT_DATABASE_URL"
            printf 'AUTH_MODE=cognito\n'
            printf 'COGNITO_USER_POOL_ID=%s\n' "$COGNITO_USER_POOL_ID"
            printf 'COGNITO_CLIENT_ID=%s\n' "$COGNITO_CLIENT_ID"
            printf 'PROOFS_BUCKET_NAME=%s\n' "$PROOFS_BUCKET_NAME"
            printf 'TF_VAR_amplify_repository_url=%s\n' "$TF_VAR_amplify_repository_url"
            printf 'TF_VAR_amplify_access_token=%s\n' "$TF_VAR_amplify_access_token"
            printf 'TF_VAR_amplify_branch_name=%s\n' "$TF_VAR_amplify_branch_name"
          } > .env.prod

      - name: Deploy
        run: npm run deploy
