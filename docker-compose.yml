services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: condoledger
      POSTGRES_USER: condoledger
      POSTGRES_PASSWORD: condoledger
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condoledger -d condoledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
